name: Generate Contribution Activity

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Ashutosh00710/github-readme-activity-graph@master
        with:
          username: ${{ github.repository_owner }}
          theme: radical
          hide_border: true
      - run: |
          mkdir -p assets
          if [ -f "activity.svg" ]; then mv activity.svg assets/invaders.svg; fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git diff --staged --quiet || git commit -m "chore: update activity graph"
          git push
